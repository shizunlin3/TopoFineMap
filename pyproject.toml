[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topofinemap"
version = "1.0.0"
description = "TopoFineMap reference implementation and Paper A reproducibility assets"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Zunlin Shi"},
  {name = "Zhi Li"},
  {name = "Lizhou He"},
  {name = "Fan Yang"}
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "networkx>=3.0",
  "PyYAML>=6.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
